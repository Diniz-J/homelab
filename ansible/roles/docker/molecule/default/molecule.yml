---
dependency:
  name: galaxy

driver:
  name: docker

platforms:
  - name: homelab-docker-jammy
    image: geerlingguy/docker-ubuntu2204-ansible:latest
    pre_build_image: true
    command: /usr/sbin/init
    # Needed to run dockerd inside the test container. Molecule sheds
    # the privileges once converge finishes.
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw

provisioner:
  name: ansible
  config_options:
    defaults:
      callbacks_enabled: profile_tasks
      stdout_callback: yaml

verifier:
  name: ansible
