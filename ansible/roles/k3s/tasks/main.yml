---
- name: Fetch the k3s install script
  ansible.builtin.get_url:
    url: https://get.k3s.io
    dest: /usr/local/bin/k3s-install.sh
    mode: "0755"
    force: false

- name: Install k3s
  ansible.builtin.command: /usr/local/bin/k3s-install.sh
  args:
    creates: /usr/local/bin/k3s
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
    INSTALL_K3S_EXEC: >-
      server
      {% for component in k3s_disable %} --disable={{ component }}{% endfor %}
      --write-kubeconfig-mode={{ k3s_write_kubeconfig_mode }}
  notify: Restart k3s

- name: Ensure k3s is enabled and running
  ansible.builtin.service:
    name: k3s
    enabled: true
    state: started
  when: not ansible_check_mode

- name: Wait for the API to answer
  ansible.builtin.wait_for:
    port: 6443
    timeout: 120
  when: not ansible_check_mode

- name: Ensure .kube directory for the admin user
  ansible.builtin.file:
    path: "/home/{{ k3s_user }}/.kube"
    state: directory
    owner: "{{ k3s_user }}"
    group: "{{ k3s_user }}"
    mode: "0700"

- name: Copy kubeconfig into the admin user's HOME
  ansible.builtin.copy:
    src: /etc/rancher/k3s/k3s.yaml
    dest: "/home/{{ k3s_user }}/.kube/config"
    remote_src: true
    owner: "{{ k3s_user }}"
    group: "{{ k3s_user }}"
    mode: "0600"
  when: not ansible_check_mode
