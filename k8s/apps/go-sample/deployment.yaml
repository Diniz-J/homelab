apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-sample
  labels:
    app.kubernetes.io/name: go-sample
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: go-sample
  template:
    metadata:
      labels:
        app.kubernetes.io/name: go-sample
    spec:
      containers:
        - name: go-sample
          image: ghcr.io/diniz-j/go-sample:main
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: [ALL]
