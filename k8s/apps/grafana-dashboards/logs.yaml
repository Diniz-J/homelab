apiVersion: v1
kind: ConfigMap
metadata:
  name: logs-dashboard
  labels:
    grafana_dashboard: "1"
data:
  logs.json: |-
    {
      "annotations": { "list": [] },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 0,
      "links": [],
      "panels": [
        {
          "datasource": { "type": "loki", "uid": "loki" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "axisPlacement": "auto",
                "drawStyle": "bars",
                "fillOpacity": 60,
                "lineWidth": 1,
                "showPoints": "never",
                "stacking": { "mode": "normal", "group": "A" }
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 0 },
          "id": 1,
          "options": {
            "legend": { "calcs": ["sum"], "displayMode": "table", "placement": "right", "showLegend": true },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [
            {
              "expr": "sum by (namespace) (count_over_time({namespace=~\".+\"}[$__interval]))",
              "legendFormat": "{{ namespace }}",
              "refId": "A"
            }
          ],
          "title": "Log volume by namespace",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "loki", "uid": "loki" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green",  "value": null },
                  { "color": "yellow", "value": 1 },
                  { "color": "red",    "value": 10 }
                ]
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 8 },
          "id": 2,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "value_and_name"
          },
          "pluginVersion": "11.0.0",
          "targets": [
            {
              "expr": "sum(rate({namespace=~\".+\"} |~ \"(?i)error|exception|panic|fatal\" [5m]))",
              "legendFormat": "errors/sec",
              "refId": "A"
            }
          ],
          "title": "Error rate (5m)",
          "type": "stat"
        },
        {
          "datasource": { "type": "loki", "uid": "loki" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "continuous-BlPu" },
              "custom": {
                "align": "auto",
                "cellOptions": { "type": "color-background" }
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 18, "x": 6, "y": 8 },
          "id": 3,
          "options": {
            "cellHeight": "sm",
            "footer": { "countRows": false, "fields": "", "reducer": ["sum"], "show": false },
            "showHeader": true
          },
          "pluginVersion": "11.0.0",
          "targets": [
            {
              "expr": "topk(10, sum by (pod) (count_over_time({namespace=~\".+\"}[1h])))",
              "format": "table",
              "instant": true,
              "refId": "A"
            }
          ],
          "title": "Top 10 emitters (last 1h)",
          "type": "table"
        },
        {
          "datasource": { "type": "loki", "uid": "loki" },
          "gridPos": { "h": 10, "w": 24, "x": 0, "y": 16 },
          "id": 4,
          "options": {
            "dedupStrategy": "none",
            "enableLogDetails": true,
            "prettifyLogMessage": false,
            "showCommonLabels": false,
            "showLabels": false,
            "showTime": true,
            "sortOrder": "Descending",
            "wrapLogMessage": true
          },
          "targets": [
            {
              "expr": "{namespace=~\".+\"} |~ \"(?i)error|exception|panic|fatal\"",
              "refId": "A"
            }
          ],
          "title": "Recent errors",
          "type": "logs"
        }
      ],
      "schemaVersion": 39,
      "tags": ["homelab", "logs", "loki"],
      "templating": { "list": [] },
      "time": { "from": "now-1h", "to": "now" },
      "timepicker": {},
      "timezone": "America/Sao_Paulo",
      "title": "Logs",
      "uid": "logs",
      "version": 1,
      "weekStart": ""
    }
