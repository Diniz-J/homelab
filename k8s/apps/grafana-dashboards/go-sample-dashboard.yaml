apiVersion: v1
kind: ConfigMap
metadata:
  name: go-sample-dashboard
  labels:
    # Picked up by the Grafana sidecar provisioner shipped with
    # kube-prometheus-stack. Any ConfigMap with this label in any
    # namespace becomes a provisioned dashboard.
    grafana_dashboard: "1"
data:
  go-sample.json: |-
    {
      "annotations": { "list": [] },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 0,
      "links": [],
      "panels": [
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "mappings": [
                { "options": { "0": { "text": "DOWN", "color": "red" } }, "type": "value" },
                { "options": { "1": { "text": "UP",   "color": "green" } }, "type": "value" }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red",   "value": null },
                  { "color": "green", "value": 1 }
                ]
              }
            },
            "overrides": []
          },
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 0 },
          "id": 1,
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "value"
          },
          "pluginVersion": "11.0.0",
          "targets": [
            { "expr": "up{job=\"go-sample\"}", "refId": "A" }
          ],
          "title": "go-sample",
          "type": "stat"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "thresholds": { "mode": "absolute", "steps": [ { "color": "blue", "value": null } ] }
            },
            "overrides": []
          },
          "gridPos": { "h": 4, "w": 6, "x": 6, "y": 0 },
          "id": 2,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "value_and_name"
          },
          "pluginVersion": "11.0.0",
          "targets": [
            { "expr": "homelab_boom_total", "legendFormat": "booms", "refId": "A" }
          ],
          "title": "Total /boom calls",
          "type": "stat"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "axisPlacement": "auto",
                "drawStyle": "line",
                "fillOpacity": 10,
                "lineInterpolation": "linear",
                "lineWidth": 2,
                "showPoints": "never",
                "spanNulls": false
              },
              "unit": "reqps"
            },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 4 },
          "id": 3,
          "options": {
            "legend": { "calcs": [], "displayMode": "list", "placement": "bottom", "showLegend": true },
            "tooltip": { "mode": "single", "sort": "none" }
          },
          "targets": [
            { "expr": "rate(homelab_healthz_total[5m])", "legendFormat": "healthz", "refId": "A" },
            { "expr": "rate(homelab_boom_total[5m])",    "legendFormat": "boom",    "refId": "B" }
          ],
          "title": "Request rate (5m)",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "loki" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 12 },
          "id": 4,
          "options": {
            "dedupStrategy": "none",
            "enableLogDetails": true,
            "prettifyLogMessage": false,
            "showCommonLabels": false,
            "showLabels": false,
            "showTime": true,
            "sortOrder": "Descending",
            "wrapLogMessage": true
          },
          "targets": [
            { "expr": "{app=\"go-sample\"}", "refId": "A" }
          ],
          "title": "Logs",
          "type": "logs"
        }
      ],
      "schemaVersion": 39,
      "tags": ["homelab", "go-sample"],
      "templating": { "list": [] },
      "time": { "from": "now-1h", "to": "now" },
      "timepicker": {},
      "timezone": "America/Sao_Paulo",
      "title": "go-sample",
      "uid": "go-sample",
      "version": 1,
      "weekStart": ""
    }
