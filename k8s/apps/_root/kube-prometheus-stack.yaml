apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "15"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 65.8.1
    helm:
      releaseName: kps
      valuesObject:
        crds:
          enabled: true
        defaultRules:
          create: true
        prometheus:
          prometheusSpec:
            # Pick up every ServiceMonitor / PodMonitor / PrometheusRule in
            # the cluster, not only those with matching helm labels.
            serviceMonitorSelectorNilUsesHelmValues: false
            podMonitorSelectorNilUsesHelmValues: false
            ruleSelectorNilUsesHelmValues: false
            probeSelectorNilUsesHelmValues: false
            retention: 7d
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 512Mi
        grafana:
          enabled: true
          # TODO: move to SOPS-encrypted Secret before anything real runs here.
          adminPassword: admin
          defaultDashboardsTimezone: America/Sao_Paulo
          ingress:
            enabled: true
            ingressClassName: traefik
            annotations:
              cert-manager.io/cluster-issuer: homelab-ca
            hosts:
              - grafana.homelab.localhost
            tls:
              - secretName: grafana-tls
                hosts:
                  - grafana.homelab.localhost
        alertmanager:
          enabled: true
          alertmanagerSpec:
            retention: 120h
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 64Mi
            # Full config comes from a user-managed Secret rather than
            # this values file -- the Telegram bot token has no business
            # living in plaintext git. Create it with SOPS following
            # docs/alerting-telegram.md.
            configSecret: alertmanager-telegram
          # We ship no in-chart config: everything lives in the Secret.
          config: null
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      # The chart ships 25+ MB of CRDs; apply them without the last-applied
      # annotation to avoid the 262 kB metadata limit.
      - Replace=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 2m
