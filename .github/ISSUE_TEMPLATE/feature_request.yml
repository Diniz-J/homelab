name: Feature request
description: Something the lab doesn't do yet that would earn its keep.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Low ceremony is fine. Skip the sections that don't apply.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What's missing today and why that matters.
      placeholder: Alertmanager needs manual `kubectl apply` after rotation.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Rough shape of the change. Code paths, manifests, scripts.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Options you ruled out, and why.

  - type: dropdown
    id: layer
    attributes:
      label: Layer
      options:
        - Terraform
        - Ansible
        - k8s / ArgoCD
        - Observability (Prom / Grafana / Loki / Alloy)
        - Backup / MinIO
        - Scripts / Makefile
        - Docs
        - CI
        - Other
    validations:
      required: true
