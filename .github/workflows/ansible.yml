name: ansible

on:
  pull_request:
    paths:
      - 'ansible/**'
      - '.ansible-lint'
      - '.github/workflows/ansible.yml'
  push:
    branches: [main]
    paths:
      - 'ansible/**'
      - '.ansible-lint'
      - '.github/workflows/ansible.yml'

permissions:
  contents: read

jobs:
  lint:
    name: ansible-lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ansible-lint
        run: |
          python -m pip install --upgrade pip
          pip install "ansible-core>=2.17" "ansible-lint>=24.9.0"
          ansible-galaxy collection install community.general ansible.posix

      - name: Lint
        working-directory: ansible
        run: ansible-lint
